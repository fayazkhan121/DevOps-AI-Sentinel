services:
  sentinel:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique value at least 16 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a unique value at least 16 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SQLITE_PATH: /data/sentinel.db
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-devops_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-90}
    volumes:
      - sentinel-data:/data

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - sentinel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-devops_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    profiles: ["tls"]
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:-./deploy/tls/cert.pem}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_PATH:-./deploy/tls/key.pem}:/etc/nginx/tls/key.pem:ro
    depends_on:
      - sentinel

volumes:
  sentinel-data:
  sentinel-pg:
